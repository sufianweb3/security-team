[project]
name = "sentinel-auditor"
version = "0.3.0"
description = "Read-only, evidence-driven multi-agent security auditor (OpenCode / Claude Code / Codex)"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["PyYAML==6.0.3", "jsonschema==4.26.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
sentinel-auditor = "auditor.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["auditor", "auditor.adapters"]
